[package]
name = "assistant-server"
description = "Axum HTTP and WebSocket surface for the assistant. Modular monolith."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
assistant-auth.workspace = true
assistant-core.workspace = true
assistant-memory.workspace = true
assistant-models = { workspace = true, features = ["openai"] }
assistant-protocol.workspace = true
assistant-tools.workspace = true

axum.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

serde.workspace = true
serde_json.workspace = true
time.workspace = true
uuid.workspace = true

sqlx = { workspace = true, features = ["postgres", "uuid", "time"] }

anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

dotenvy.workspace = true
futures.workspace = true
tokio-util.workspace = true
aes-gcm.workspace = true

[dev-dependencies]
# Integration tests drive the real orchestrator with deterministic doubles.
assistant-core = { workspace = true, features = ["testing"] }
assistant-models = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.28"
reqwest = { workspace = true }
