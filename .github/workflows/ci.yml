name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The server integration tests build the real config, which requires this.
  DEV_AUTH_TOKEN: ci-placeholder-token

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs system webkit; the workspace includes
      # apps/mobile/src-tauri, so CI must have it even though CI never
      # produces a bundle.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A tracked .env is the most likely way a real credential reaches this
      # repository, so it fails the build rather than merely warning.
      - name: Reject tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]'; then
            echo "::error::a .env file is tracked; only .env.example may be committed"
            exit 1
          fi
