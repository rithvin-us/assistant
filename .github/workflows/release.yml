name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default. Only the job that actually creates a GitHub
# release re-grants `contents: write`; every other job runs read-only even
# though it executes repository-controlled build code.
permissions:
  contents: read

jobs:
  build-server:
    name: Build Production Server Binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Assistant Server (Release)
        run: cargo build --release -p assistant-server

      - name: Upload Server Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistant-server-linux-amd64
          path: target/release/assistant-server

  build-tauri:
    name: Build Tauri Mobile App Bundles
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # --frozen-lockfile so a release artefact is built from exactly the
      # dependency versions that were committed and reviewed.
      - name: Install Frontend Dependencies
        run: |
          cd apps/mobile
          pnpm install --frozen-lockfile

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './apps/mobile'
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: 'Automated production build for ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
