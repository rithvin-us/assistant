[package]
name = "assistant-models"
description = "Provider-agnostic model abstraction, plus provider implementations behind features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Deterministic in-process provider used by tests and by nothing else. Off by
# default, so no release binary links it.
mock = []
# The Anthropic Messages API provider. Off by default so a build that does not
# use it does not link reqwest, and so `assistant-core` can never depend on it
# transitively. See docs/DECISIONS.md ADR-0018.
anthropic = ["dep:reqwest", "dep:tokio", "dep:tracing"]
# The OpenAI Chat Completions API provider.
openai = ["dep:reqwest", "dep:tokio", "dep:tracing"]

[dependencies]
assistant-tools = { workspace = true }
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Provider-only. `optional` keeps them out of a build that enables no provider.
reqwest = { workspace = true, features = ["stream"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# A self dev-dependency turns `mock` on for this package's own test build only.
# Without it the mock tests compile away to nothing under
# `cargo test -p assistant-models`, and only ran at all because another crate's
# dev-dependency happened to unify the feature during a workspace build.
# `anthropic` and `openai` are enabled the same way, so the provider tests compile here
# without forcing the feature on any dependent.
assistant-models = { path = ".", features = ["mock", "anthropic", "openai"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
futures.workspace = true
# The live smoke test reads ANTHROPIC_API_KEY from a local .env, the same file
# the server reads. Tests only -- the provider itself reads no environment.
dotenvy.workspace = true
