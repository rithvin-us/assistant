[package]
name = "assistant-planning"
version = "0.1.0"
edition = "2021"
description = "Deterministic provider-independent unified planning domain and calculation engine for Google Antigravity Assistant"

[dependencies]
assistant-protocol = { workspace = true }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
tracing = "0.1"
uuid = { version = "1.15", features = ["serde", "v4", "v5"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
